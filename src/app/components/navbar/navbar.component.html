<nav class="navbar">
  <div class="nav-left">
    <div class="nav-metrics">
      <div class="nav-scores">
        <span class="score-chip">Score {{ score$ | async }}</span>
        <span class="score-chip best-chip">Best TS {{ (bestScores$ | async)?.ts }}</span>
        <span class="score-chip best-chip">Best WASM {{ (bestScores$ | async)?.wasm }}</span>
      </div>
      <div class="nav-scores engine-percentages" *ngIf="(runs$ | async) as runs">
        <span class="score-chip">TS 32768 {{ getEngineReachedPercent(runs, 'ts') }}%</span>
        <span class="score-chip">WASM 32768 {{ getEngineReachedPercent(runs, 'wasm') }}%</span>
      </div>
    </div>
  </div>
  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active">Home</a>
    <a routerLink="/runs" routerLinkActive="active">Runs</a>
  </div>
</nav>
