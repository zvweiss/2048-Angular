<app-navbar />

<div class="game-container">
  <div class="page-container" appSwipe (swipe)="move($event)">
    <div class="score-container">
      <div class="score-box">
        <div>Score</div>
        <div>{{ score$ | async }}</div>
      </div>
      <div class="score-box">
        <div>Best</div>
        <div>{{ bestScore$ | async }}</div>
      </div>
      <div class="score-box">
        <div>Moves</div>
        <div>{{ moveCount$ | async }}</div>
      </div>
    </div>

    <div class="controls">
      <button (click)="restart()">🔄</button>
      <button (click)="undo()" [disabled]="!(undoAvailable$ | async)">↩️</button>
    </div>

    <div class="ai-controls">
      <div class="ai-primary">
        <div class="ai-buttons">
          <button (click)="toggleAiRun()" [disabled]="gameOverActive">
            {{ aiRunning ? 'Stop AI' : 'Run AI' }}
          </button>
          <button (click)="stepAi()" [disabled]="aiRunning || gameOverActive">
            Single Step
          </button>
        </div>
      </div>

      <details class="ai-advanced">
        <summary>AI Settings</summary>
        <label class="ai-speed">
          AI Speed
          <input
            type="range"
            min="5"
            max="1000"
            step="10"
            [(ngModel)]="aiSpeedMs"
            (input)="updateAiSpeed()"
          />
          <span>{{ aiSpeedMs }} ms</span>
        </label>
        <label class="ai-speed">
          Min Depth
          <input
            type="range"
            min="1"
            max="6"
            step="1"
            [(ngModel)]="aiMindepth"
            (input)="updateAiConfig()"
          />
          <span>{{ aiMindepth }}</span>
        </label>
        <label class="ai-speed">
          Smartness
          <input
            type="range"
            min="1"
            max="10"
            step="1"
            [(ngModel)]="aiSmartness"
            (input)="updateAiConfig()"
          />
          <span>{{ aiSmartness }}</span>
        </label>
      </details>
    </div>

    <app-game-board></app-game-board>

    <div class="ai-summary" *ngIf="aiSummary">
      {{ aiSummary }}
    </div>

    <div
      class="debug-controls"
      *ngIf="debugMode && debugVisible; else debugToggleOnly"
    >
      <button class="debug-toggle" (click)="toggleDebug()">
        Hide Debug Panel
      </button>
    </div>
    <ng-template #debugToggleOnly>
      <button class="debug-toggle" (click)="toggleDebug()" *ngIf="debugMode">
        Show Debug Panel
      </button>
    </ng-template>

    <app-debug-panel *ngIf="debugMode && debugVisible" />

    <!-- WIN POPUP -->
    <div class="overlay" *ngIf="(win$ | async) && !aiRunning && !winFromAiRun">
      <div class="popup">
        <h2>🎉 You win!</h2>
        <p>Keep playing to reach higher scores.</p>
        <button (click)="dismissWin()">Continue</button>
      </div>
    </div>

    <!-- GAME OVER POPUP -->
    <div class="overlay" *ngIf="(gameOver$ | async) && !gameOverDismissed">
      <div class="popup">
        <h2>💀 Game Over</h2>
        <p>No more valid moves. Try again!</p>
        <button (click)="dismissGameOver()">Dismiss</button>
      </div>
    </div>
  </div>
</div>
