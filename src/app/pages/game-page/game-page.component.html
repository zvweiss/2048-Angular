<app-navbar />

<div class="game-container">
  <div class="page-container" appSwipe (swipe)="move($event)">
    <div class="controls">
      <div class="control-item">
        <button (click)="restart()" title="Restart game">🔄</button>
        <span class="control-label">Restart</span>
      </div>
      <div class="control-item">
        <button
          (click)="toggleAiRun()"
          [disabled]="gameOverActive"
          [title]="aiRunning ? 'Stop AI' : 'Run AI'"
        >
          {{ aiRunning ? '🔴' : '🟢' }}
        </button>
        <span class="control-label">Run/Stop</span>
      </div>
      <div class="control-item">
        <button
          (click)="stepAi()"
          [disabled]="aiRunning || gameOverActive"
          [attr.title]="aiRunning || gameOverActive ? null : 'Single Step'"
        >
          🚶
        </button>
        <span class="control-label">Step</span>
      </div>
      <div class="control-item">
        <button
          (click)="showHint()"
          [disabled]="aiRunning || gameOverActive || hintLoading"
          [attr.title]="aiRunning || gameOverActive ? null : 'Hint'"
        >
          {{ hintIcon() }}
        </button>
        <span class="control-label">Hint</span>
      </div>
    </div>

    <div class="ai-controls">
      <div class="ai-primary">
        <div class="ai-buttons">
          <button
            class="ai-step-primary"
            (click)="stepAi()"
            [disabled]="aiRunning || gameOverActive"
          >
            Single Step
          </button>
        </div>
      </div>

      <details class="ai-advanced">
        <summary>AI Settings</summary>
        <label class="ai-speed">
          AI Speed ({{ aiSpeedMs }} ms)
          <input
            type="range"
            min="5"
            max="1000"
            step="10"
            [(ngModel)]="aiSpeedMs"
            (input)="updateAiSpeed()"
          />
        </label>
        <label class="ai-speed">
          Min Depth ({{ aiMindepth }})
          <input
            type="range"
            min="1"
            max="6"
            step="1"
            [(ngModel)]="aiMindepth"
            (input)="updateAiConfig()"
          />
        </label>
        <label class="ai-speed">
          Smartness ({{ aiSmartness }})
          <input
            type="range"
            min="1"
            max="10"
            step="1"
            [(ngModel)]="aiSmartness"
            (input)="updateAiConfig()"
          />
        </label>
      </details>
    </div>

    <div class="board-wrap">
      <app-game-board></app-game-board>
      <div class="hint-overlay" *ngIf="hintDirection as dir">
        <div class="hint-arrow">{{ hintArrow(dir) }}</div>
      </div>
    </div>
    <div class="hint-caption" [class.is-visible]="hintDirection">
      <span class="hint-desktop">Hint only — you can still move any direction (arrow keys)</span>
      <span class="hint-mobile">Hint only — you can still move any direction (swipe)</span>
    </div>

    <div
      class="debug-controls"
      *ngIf="debugMode && debugVisible; else debugToggleOnly"
    >
      <button class="debug-toggle" (click)="toggleDebug()">
        Hide Debug Panel
      </button>
    </div>
    <ng-template #debugToggleOnly>
      <button class="debug-toggle" (click)="toggleDebug()" *ngIf="debugMode">
        Show Debug Panel
      </button>
    </ng-template>

    <app-debug-panel *ngIf="debugMode && debugVisible" />

    <!-- WIN POPUP -->
    <div class="overlay" *ngIf="(win$ | async) && !aiRunning && !winFromAiRun">
      <div class="popup">
        <h2>🎉 You win!</h2>
        <p>Keep playing to reach higher scores.</p>
        <button (click)="dismissWin()">Continue</button>
      </div>
    </div>

    <!-- GAME OVER POPUP -->
    <div class="overlay" *ngIf="(gameOver$ | async) && !gameOverDismissed">
      <div class="popup">
        <h2>💀 Game Over</h2>
        <p>No more valid moves. Try again!</p>
        <button (click)="dismissGameOver()">Dismiss</button>
      </div>
    </div>
  </div>
</div>
