<app-navbar />

<div class="game-container">
  <div class="page-container" appSwipe (swipe)="move($event)">
    <div class="score-container">
      <div class="score-box">
        <div>Score</div>
        <div>{{ score$ | async }}</div>
      </div>
      <div class="score-box">
        <div>Best</div>
        <div>{{ bestScore$ | async }}</div>
      </div>
    </div>

    <app-game-board />

    <!-- Controls -->
    <div class="controls">
      <button (click)="move('up')">⬆️</button>
      <div>
        <button (click)="move('left')">⬅️</button>
        <button (click)="move('down')">⬇️</button>
        <button (click)="move('right')">➡️</button>
      </div>
    </div>

    <div class="controls">
      <button (click)="restart()">🔄</button>
      <button (click)="toggleUndoEnabled()">
        {{ (undoEnabled$ | async) ? "Disable Undo" : "Enable Undo" }}
      </button>
      <button (click)="undo()" [disabled]="!(undoAvailable$ | async)">↩️</button>
    </div>

    <button class="debug-toggle" (click)="toggleDebug()">
      {{ debugVisible ? "Hide" : "Show" }} Debug Panel
    </button>

    <app-debug-panel *ngIf="debugVisible" />
  </div>
</div>
