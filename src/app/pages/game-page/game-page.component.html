<app-navbar />

<div class="game-container">
  <div class="page-container" appSwipe (swipe)="move($event)">
    <div class="score-container">
      <div class="score-box">
        <div>Score</div>
        <div>{{ score$ | async }}</div>
      </div>
      <div class="score-box">
        <div>Best</div>
        <div>{{ bestScore$ | async }}</div>
      </div>
      <div class="score-box">
        <div>Moves</div>
        <div>{{ moveCount$ | async }}</div>
      </div>
    </div>

    <div class="controls">
      <button (click)="restart()">🔄</button>
      <button (click)="undo()" [disabled]="!(undoAvailable$ | async)">↩️</button>
    </div>

    <div class="ai-controls">
      <label>
        AI Strategy
        <select [(ngModel)]="aiStrategy" [disabled]="aiRunning">
          <option value="expectimax">Expectimax</option>
          <option value="random">Random</option>
          <option value="greedy">Greedy</option>
        </select>
      </label>
      <label class="ai-speed">
        AI Speed
        <input
          type="range"
          min="5"
          max="1000"
          step="10"
          [(ngModel)]="aiSpeedMs"
          (input)="updateAiSpeed()"
        />
        <span>{{ aiSpeedMs }} ms</span>
      </label>
      <div
        class="expectimax-controls"
        *ngIf="aiStrategy === 'expectimax' && aiConfig"
      >
        <label class="ai-depth">
          Depth
          <input
            type="range"
            min="1"
            max="4"
            step="1"
            [(ngModel)]="aiConfig.depth"
            (input)="syncExpectimaxConfig()"
          />
          <span>{{ aiConfig.depth }}</span>
        </label>
        <label class="ai-weight">
          Empty
          <input
            type="range"
            min="0"
            max="5"
            step="0.1"
            [(ngModel)]="aiConfig.weights.empty"
            (input)="syncExpectimaxConfig()"
          />
          <span>{{ aiConfig.weights.empty | number: '1.1-1' }}</span>
        </label>
        <label class="ai-weight">
          Monotonic
          <input
            type="range"
            min="0"
            max="5"
            step="0.1"
            [(ngModel)]="aiConfig.weights.monotonicity"
            (input)="syncExpectimaxConfig()"
          />
          <span>{{ aiConfig.weights.monotonicity | number: '1.1-1' }}</span>
        </label>
        <label class="ai-weight">
          Smooth
          <input
            type="range"
            min="0"
            max="5"
            step="0.1"
            [(ngModel)]="aiConfig.weights.smoothness"
            (input)="syncExpectimaxConfig()"
          />
          <span>{{ aiConfig.weights.smoothness | number: '1.1-1' }}</span>
        </label>
        <label class="ai-weight">
          Max Tile
          <input
            type="range"
            min="0"
            max="5"
            step="0.1"
            [(ngModel)]="aiConfig.weights.maxTile"
            (input)="syncExpectimaxConfig()"
          />
          <span>{{ aiConfig.weights.maxTile | number: '1.1-1' }}</span>
        </label>
        <label class="ai-weight">
          Corner
          <input
            type="range"
            min="0"
            max="5"
            step="0.1"
            [(ngModel)]="aiConfig.weights.corner"
            (input)="syncExpectimaxConfig()"
          />
          <span>{{ aiConfig.weights.corner | number: '1.1-1' }}</span>
        </label>
      </div>
      <div class="ai-buttons">
        <button (click)="toggleAiRun()" [disabled]="gameOverActive">
          {{ aiRunning ? 'Stop AI' : 'Run AI' }}
        </button>
        <button (click)="stepAi()" [disabled]="aiRunning || gameOverActive">
          Single Step
        </button>
      </div>
    </div>

    <app-game-board></app-game-board>

    <button class="debug-toggle" (click)="toggleDebug()">
      {{ debugVisible ? 'Hide' : 'Show' }} Debug Panel
    </button>

    <app-debug-panel *ngIf="debugVisible" />

    <!-- WIN POPUP -->
    <div class="overlay" *ngIf="win$ | async">
      <div class="popup">
        <h2>🎉 You win!</h2>
        <p>Keep playing to reach higher scores.</p>
        <button (click)="dismissWin()">Continue</button>
      </div>
    </div>

    <!-- GAME OVER POPUP -->
    <div class="overlay" *ngIf="gameOver$ | async">
      <div class="popup">
        <h2>💀 Game Over</h2>
        <p>No more valid moves. Try again!</p>
        <button (click)="dismissGameOver()">Restart</button>
      </div>
    </div>
  </div>
</div>
